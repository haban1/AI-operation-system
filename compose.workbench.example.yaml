# Content generation: automatic hot topics and the unified video studio.
# Docker Compose 2.24.4+ is required for !override.
# Existing host automatic-hot-topic engine only. For a fresh install use compose.signal.yaml;
# see docs/Windows本机部署.md. Do not combine the two overlays.
# Merge and validate without printing credentials:
# docker compose --env-file .env.docker -f compose.yaml -f compose.workbench.example.yaml config --quiet
# Start or update the web service:
# docker compose --env-file .env.docker -f compose.yaml -f compose.workbench.example.yaml up -d --build web
# VIDEO_RELAY_* values must be in the shell or --env-file used above.
services:
  web:
    ports: !override
      - "127.0.0.1:3100:3100"
    environment:
      AI_SIGNAL_STUDIO_URL: "${AI_SIGNAL_STUDIO_URL:-http://127.0.0.1:8892/}"
      AI_SIGNAL_STUDIO_HEALTH_URL: "${AI_SIGNAL_STUDIO_HEALTH_URL:-http://host.docker.internal:8892/api/health}"
      CONTENT_LIBRARY_DIR: /app/data/content-library
      CONTENT_LIBRARY_SIGNAL_ROOT: /sources/ai-signal
      VIDEO_STUDIO_DATA_DIR: /app/data/video-studio
      VIDEO_RELAY_BASE_URL: "${VIDEO_RELAY_BASE_URL:-https://cs.intellidriven.cn/v1}"
      VIDEO_RELAY_API_KEY: "${VIDEO_RELAY_API_KEY:-}"
      VIDEO_RELAY_MODEL: "${VIDEO_RELAY_MODEL:-gpt-6-astra}"
      VIDEO_MATERIALS_DIR: /sources/video-materials
    volumes:
      - type: bind
        source: "${VIDEO_MATERIALS_HOST_DIR:-./sample-material}"
        target: /sources/video-materials
        read_only: true
        bind:
          create_host_path: false
      # Optional: mount the automatic-hot-topic service's existing data.
      # - type: bind
      #   source: "${AI_SIGNAL_HOST_DIR:?Set AI_SIGNAL_HOST_DIR}"
      #   target: /sources/ai-signal
      #   read_only: true
      #   bind:
      #     create_host_path: false
