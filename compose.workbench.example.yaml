# Local three-route workbench. Docker Compose 2.24.4+ is required for !override.
services:
  web:
    ports: !override
      - "127.0.0.1:3100:3100"
    environment:
      AI_SIGNAL_STUDIO_URL: http://127.0.0.1:8892/
      AI_SIGNAL_STUDIO_HEALTH_URL: http://host.docker.internal:8892/api/health
      VIDEO_EDITING_URL: http://127.0.0.1:5199/
      VIDEO_EDITING_HEALTH_URL: http://host.docker.internal:5199/
      AIGC_CREATION_URL: http://127.0.0.1:13000/
      AIGC_CREATION_HEALTH_URL: http://host.docker.internal:13000/
      CONTENT_LIBRARY_DIR: /app/data/content-library
      CONTENT_LIBRARY_SIGNAL_ROOT: /sources/ai-signal
      CONTENT_LIBRARY_EDITING_ROOT: /sources/openchatcut
      CONTENT_LIBRARY_CREATION_ROOT: /sources/toonflow
    volumes:
      - type: bind
        source: "${AI_SIGNAL_HOST_DIR:?Set AI_SIGNAL_HOST_DIR to the AI Signal Studio data directory}/runs"
        target: /sources/ai-signal/runs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${AI_SIGNAL_HOST_DIR:?Set AI_SIGNAL_HOST_DIR to the AI Signal Studio data directory}/data/library-review.json"
        target: /sources/ai-signal/data/library-review.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${AI_SIGNAL_HOST_DIR:?Set AI_SIGNAL_HOST_DIR to the AI Signal Studio data directory}/data/comparisons"
        target: /sources/ai-signal/data/comparisons
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${OPENCHATCUT_PROFILE_DIR:?Set OPENCHATCUT_PROFILE_DIR to the OpenChatCut profile directory}/project-store-v1.sqlite3"
        target: /sources/openchatcut/project-store-v1.sqlite3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${OPENCHATCUT_PROFILE_DIR:?Set OPENCHATCUT_PROFILE_DIR to the OpenChatCut profile directory}/project-store-v1.sqlite3-wal"
        target: /sources/openchatcut/project-store-v1.sqlite3-wal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${OPENCHATCUT_PROFILE_DIR:?Set OPENCHATCUT_PROFILE_DIR to the OpenChatCut profile directory}/project-store-v1.sqlite3-shm"
        target: /sources/openchatcut/project-store-v1.sqlite3-shm
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${OPENCHATCUT_PROFILE_DIR:?Set OPENCHATCUT_PROFILE_DIR to the OpenChatCut profile directory}/media/uploads"
        target: /sources/openchatcut/media/uploads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TOONFLOW_WORKSPACE_DIR:?Set TOONFLOW_WORKSPACE_DIR to the Toonflow workspaces directory}"
        target: /sources/toonflow
        read_only: true
        bind:
          create_host_path: false
