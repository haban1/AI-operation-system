<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#080d12" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>智慧驱动</title>
  <script src="/theme.js?v=20261111-v2"></script>
  <link rel="stylesheet" href="/styles.css?v=20261102-platform-base-theme-20261111" />
  <link rel="stylesheet" href="/hot-topic-studio.css?v=20261111-creation-nav-2" />
  <link rel="stylesheet" href="/workspace.css?v=20261111-theme-tokens" />
  <link rel="stylesheet" href="/workspace-interactions.css?v=20261111-theme-tokens">
  <link rel="stylesheet" href="/workspace-v2.css?v=20261112-fix9">
  <link rel="stylesheet" href="/theme.css?v=20261111-v2c">
  <link rel="stylesheet" href="/ui-controls.css?v=20261112-shell">
  <link rel="stylesheet" href="/app-shell.css?v=20261112-fix6">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img"><path d="M8 8.5 16 4l8 4.5v9L16 22l-8-4.5z"/><path d="m8 17.5 8 4.5 8-4.5V24l-8 4-8-4z"/></svg>
        </div>
        <div class="brand-copy"><strong>智慧驱动</strong></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-spacer"></div>
      <details class="side-status"><summary>运行状态</summary>
        <div class="side-status-head"><span>自动任务</span><em id="operationsBadge">运行中</em></div>
        <div class="status-line"><i id="cloudDot"></i><span>云端服务</span><b id="cloudStatus">检查中</b></div>
        <div class="status-line"><i id="agentDot"></i><span>采集服务</span><b id="agentStatus">检查中</b></div>
          <span class="mode-pill" id="qwenMode"><i></i>AI：—</span>
          <button class="master-switch is-on" id="masterSwitch" type="button" role="switch" aria-checked="true" aria-label="全局运行总开关">
            <span class="master-switch-track" aria-hidden="true"><i></i></span>
            <span class="master-switch-copy"><b>全局运行</b><small>自动任务已开启</small></span>
          </button>
      </details>
      <div class="side-actions">
          <button class="ghost icon-button" id="refreshBtn" title="刷新当前页面" aria-label="刷新当前页面">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M18.5 9A7 7 0 1 0 19 15"/></svg><span>刷新</span>
          </button>
          <button class="ghost" id="logoutBtn" type="button" hidden>退出</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="page-heading">
          <span class="page-context" id="pageContext" hidden></span>
          <h1 id="pageTitle">运营总览</h1>
          <p id="pageSubtitle" hidden></p>
        </div>
      </header>
      <section id="content" class="content"><div class="loading"><i></i><span>正在加载运营工作台…</span></div></section>
    </main>
  </div>
  <div id="loginScreen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand"><span>智</span><div><b>智慧驱动</b></div></div>
      <div class="login-copy"><h2>登录工作台</h2></div>
      <form id="loginForm" class="login-form">
        <label>管理员账号<input name="username" autocomplete="username" value="admin" required></label>
        <label>登录密码<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="loginError" class="login-error" role="alert"></p>
        <button id="loginSubmit" class="btn full" type="submit">登录</button>
      </form>

    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js?v=20261112-fix7"></script>
  <script type="module">import { startSelectEnhancer } from '/ui-select.js?v=20261112-controls'; startSelectEnhancer();</script>
  <script type="module">import { startAppShell } from '/app-shell.js?v=20261112-fix7'; startAppShell();</script>
</body>
</html>
