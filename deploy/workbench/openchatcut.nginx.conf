pid /tmp/openchatcut-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/occ-client;
  proxy_temp_path /tmp/occ-proxy;
  fastcgi_temp_path /tmp/occ-fastcgi;
  uwsgi_temp_path /tmp/occ-uwsgi;
  scgi_temp_path /tmp/occ-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 5200 default_server;
    server_name _;
    # Docker publishes only on host loopback; still reject DNS rebinding hosts.
    if ($http_host != "127.0.0.1:5199") { return 403; }
    client_max_body_size 4g;
    location / {
      proxy_pass http://127.0.0.1:5199;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
