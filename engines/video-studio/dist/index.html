<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#147c72">
<title>混剪 · 内容生成工作台</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script src="./lucide.min.js" defer></script><script src="./app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到工作区</a>
<div class="app-shell">
<header class="studio-topbar">
<a class="brand" href="#mix/library" aria-label="内容生成首页"><span class="brand-icon"><i data-lucide="clapperboard"></i></span><span>内容生成</span></a>
<nav class="method-nav" aria-label="创作方式"><a class="method-link" href="#automatic/library" data-method="automatic"><i data-lucide="radio"></i><span>自动热点</span></a><a class="method-link active" href="#mix/library" data-method="mix"><i data-lucide="film"></i><span>混剪</span></a><a class="method-link" href="#materials" data-method="materials"><i data-lucide="folder-open"></i><span>素材库</span></a></nav>
<div class="studio-connection"><span class="connection-dot" id="connectionDot"></span><span id="connectionLabel">正在连接</span><button class="icon-button" id="refreshAll" title="刷新状态" aria-label="刷新状态"><i data-lucide="refresh-cw"></i></button></div>
</header>
<div class="workspace-shell">
<main id="main" tabindex="-1">
<section id="mixWorkspace">
<div class="mix-toolbar" id="mixToolbar"><div class="workspace-tabs" role="tablist" aria-label="混剪工作区"><a href="#mix/library" id="tab-library" role="tab" data-tab="library" aria-controls="panel-library"><i data-lucide="library"></i>成片库 <span class="count-badge" id="videoCount">0</span></a><a href="#mix/create" id="tab-create" role="tab" data-tab="create" aria-controls="panel-create"><i data-lucide="messages-square"></i>视频制作</a><a href="#mix/assets" id="tab-assets" role="tab" data-tab="assets" aria-controls="panel-assets"><i data-lucide="folder-open"></i>制作素材</a></div><div id="headingActions"><button class="button primary" id="createFromLibrary"><i data-lucide="plus"></i>制作视频</button></div></div>
<section id="panel-library" class="tab-panel library-panel" role="tabpanel" aria-labelledby="tab-library">
<div class="section-toolbar library-toolbar"><div class="section-title"><h2 id="libraryHeading">全部成片</h2><span id="librarySummary" class="muted"></span></div><div class="library-filters"><select id="outputStatusFilter" aria-label="按发布确认状态筛选"><option value="">全部状态</option><option value="pending">待确认</option><option value="approved">可发布</option></select><select id="outputSourceFilter" aria-label="按创作方式筛选"><option value="">全部来源</option><option value="mix">混剪</option><option value="automatic">自动热点</option><option value="legacy">历史素材</option></select><label class="search-field"><i data-lucide="search"></i><input id="videoSearch" type="search" placeholder="搜索作品、风格" aria-label="搜索成片"></label></div></div>
<div class="library-batchbar" id="libraryBatchbar"><label class="select-all"><input id="selectAllOutputs" type="checkbox"><span>全选待确认</span></label><span id="selectionSummary" class="muted">未选择</span><button class="button primary" id="confirmSelected" disabled><i data-lucide="check-check"></i>确认可发布</button><button class="icon-button" id="refreshOutputs" aria-label="刷新成片列表" title="刷新成片列表"><i data-lucide="refresh-cw"></i></button></div>
<div id="outputsError" class="inline-error outputs-error" role="alert" hidden></div><div id="videoGrid" class="video-grid"></div></section>
<section id="panel-create" class="tab-panel create-panel" role="tabpanel" aria-labelledby="tab-create" hidden>
<aside class="creation-config"><div class="config-section"><div class="section-title"><h2>专业工作流</h2><span class="count-badge">6</span></div><div id="skillList" class="skill-list"></div></div><div class="config-section"><h3>本次制作</h3><div class="module-options"><label><input type="checkbox" id="moduleText" checked><span>说明文字</span></label><label><input type="checkbox" id="modulePip" checked><span>画中画</span></label><label><input type="checkbox" id="moduleTransitions" checked><span>转场</span></label><label><input type="checkbox" id="moduleMusic" checked><span>配乐</span></label><label><input type="checkbox" id="moduleVoice"><span>配音</span></label></div></div><div class="config-section tool-section"><div class="section-title"><h3>制作工具</h3><button class="icon-button small" id="refreshTools" title="刷新工具状态" aria-label="刷新工具状态"><i data-lucide="refresh-cw"></i></button></div><div id="toolList" class="tool-list"></div></div></aside>
<div class="chat-workspace"><div class="chat-toolbar"><div class="chat-title"><span class="agent-mark"><i data-lucide="sparkles"></i></span><div><strong>制作助手</strong><span id="chatSubtitle">Codex</span></div></div><div class="chat-actions"><select id="sessionSelect" aria-label="选择历史会话"><option value="">新会话</option></select><button class="icon-button" id="newSession" title="新建会话" aria-label="新建会话"><i data-lucide="square-pen"></i></button></div></div><div id="chatMessages" class="chat-messages" aria-live="polite"></div>
<div class="chat-composer"><div id="selectedAssets" class="selected-assets"></div><div id="runStatus" class="run-status" hidden></div><form id="chatForm"><textarea id="chatInput" aria-label="制作要求" placeholder="描述这次想做的视频…" rows="3" maxlength="20000"></textarea><div class="composer-actions"><div class="composer-left"><button type="button" class="icon-button" id="pickAssets" title="选择素材" aria-label="选择素材"><i data-lucide="paperclip"></i></button><span id="selectedSkillLabel" class="composer-skill"></span></div><button type="button" class="button danger-outline" id="stopGeneration" hidden><i data-lucide="square"></i>停止</button><button type="submit" class="button primary" id="sendMessage"><i data-lucide="arrow-up"></i>发送</button></div></form><div id="chatError" class="inline-error" role="alert" hidden></div></div></div>
</section>
<section id="panel-assets" class="tab-panel assets-panel" role="tabpanel" aria-labelledby="tab-assets" hidden><div class="section-toolbar asset-topbar"><div class="segmented-control" aria-label="素材类型"><button class="active" data-asset-kind="content">内容素材</button><button data-asset-kind="company">公司资产</button></div><div class="toolbar-actions"><button class="button" id="addSlogan"><i data-lucide="type"></i>添加 Slogan</button><button class="button" id="addCollection"><i data-lucide="folder-plus"></i>映射目录</button></div></div><div class="asset-layout"><aside class="asset-folders"><div class="folder-heading"><span id="collectionHeading">素材目录</span><span id="collectionCount" class="muted"></span></div><div id="collectionList"></div></aside><div class="asset-browser"><div class="asset-browser-toolbar"><nav id="assetBreadcrumbs" class="asset-breadcrumbs" aria-label="素材路径"></nav><div class="asset-filter-tools"><select id="assetCategoryFilter" aria-label="按分类筛选素材"><option value="">全部分类</option></select><label class="search-field compact"><i data-lucide="search"></i><input type="search" id="assetSearch" placeholder="搜索当前目录" aria-label="搜索当前目录"></label></div></div><div id="assetGrid" class="asset-grid"></div><div id="assetFooter" class="asset-footer"></div></div></div></section>
</section>
<section id="automaticWorkspace" hidden><h1 class="sr-only">自动热点</h1><div class="automatic-frame"><iframe id="automaticFrame" title="自动热点工作台"></iframe></div></section>
</main></div></div>
<dialog id="videoDialog" class="video-dialog"><div class="dialog-header"><div><h2 id="videoDialogTitle"></h2><span id="videoDialogMeta" class="muted"></span></div><button class="icon-button" data-close-dialog="videoDialog" title="关闭预览" aria-label="关闭预览"><i data-lucide="x"></i></button></div><div class="video-stage"><video id="videoPlayer" controls playsinline preload="metadata"></video></div><div class="dialog-footer video-dialog-actions"><span id="videoDialogStatus" class="output-status"></span><button class="button primary" id="confirmPreviewOutput" hidden><i data-lucide="check"></i>确认可发布</button><button class="button primary" id="publishPreviewOutput" hidden><i data-lucide="send"></i>去发布</button><button class="button" id="useVideoStyle"><i data-lucide="wand-sparkles"></i>使用这个工作流</button><a id="downloadVideo" class="button primary" download><i data-lucide="download"></i>下载成片</a></div></dialog>
<dialog id="collectionDialog" class="form-dialog"><form id="collectionForm"><div class="dialog-header"><h2>映射本地目录</h2><button type="button" class="icon-button" data-close-dialog="collectionDialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div class="dialog-body"><label class="field-label">目录名称<input id="collectionName" required maxlength="100" placeholder="例如：课程实操"></label><label class="field-label">本地目录路径<input id="collectionPath" required placeholder="/Volumes/素材盘/课程实操" autocomplete="off"></label><label class="field-label">素材类型<select id="collectionKind"><option value="content">内容素材</option><option value="company">公司资产</option></select></label><label class="field-label" id="companyCategoryField" hidden>资产分类<select id="companyCategory"><option value="brand">品牌与 Logo</option><option value="character">虚拟形象</option><option value="other">其他固定资产</option></select></label><div id="collectionError" class="inline-error" hidden></div></div><div class="dialog-footer"><button type="button" class="button" data-close-dialog="collectionDialog">取消</button><button type="submit" class="button primary" id="saveCollection">添加目录</button></div></form></dialog>
<dialog id="sloganDialog" class="form-dialog"><form id="sloganForm"><div class="dialog-header"><h2>添加公司 Slogan</h2><button type="button" class="icon-button" data-close-dialog="sloganDialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div class="dialog-body"><label class="field-label">名称<input id="sloganName" maxlength="80" placeholder="品牌 Slogan"></label><label class="field-label">内容<textarea id="sloganText" required rows="3" maxlength="500"></textarea></label><div id="sloganError" class="inline-error" hidden></div></div><div class="dialog-footer"><button type="submit" class="button primary">保存</button></div></form></dialog>
<dialog id="assetDialog" class="form-dialog asset-preview-dialog"><div class="dialog-header"><h2 id="assetDialogTitle">素材预览</h2><button class="icon-button" data-close-dialog="assetDialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="assetPreview" class="asset-preview"></div><div class="dialog-footer"><button class="button primary" id="addPreviewToChat"><i data-lucide="plus"></i>用于制作</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
