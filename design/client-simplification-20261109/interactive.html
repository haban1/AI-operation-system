function issues(){return `${toolbar('问题记录',select('处理状态',['待处理','已处理','全部']))}${panel('',table(['问题','影响范围','时间','状态','操作'],[['发布结果待确认','视频号 · 社区活动介绍','11-09 10:18',badge('待处理','warn'),action('处理','处理发布结果待确认','ghost small')],['账号需重新登录','小红书','11-09 09:20',badge('待处理','warn'),go('去登录','accounts','ghost small')],['采集页面暂时不可用','微博','11-08 16:30',badge('已恢复'),action('详情','查看恢复记录','ghost small')]]),'','table-panel')}${details('诊断详情','错误编号、截图、浏览器日志与处理记录可在问题详情内查看。')}`;}
function runtime(){return `${toolbar('运行设置',action('保存','运行设置已保存在预览中',''))}<div class="grid cols2">${panel('自动任务',`${setting('自动任务',toggle('自动任务运行',true))}${setting('评论与私信采集',toggle('自动采集评论私信',true))}${field('采集间隔','1～2 分钟|2～3 分钟|3～4 分钟|4～5 分钟','select')}${setting('自动更新运营数据',toggle('自动更新运营数据',true))}`)}${panel('运行检查',`${setting('自动检查登录',toggle('自动检查登录',true))}${setting('失败任务提醒',toggle('失败任务提醒',true))}${setting('采集服务',badge('运行中'))}${setting('设备', '<span class="subtle tiny">运营电脑</span>')}${go('查看问题记录','issues','ghost small')}`)}</div>`;}
function login(){return `<div class="login-layout"><form class="login-box" data-form="login"><div class="row" style="color:var(--accent);margin-bottom:26px">${icon('brand')}<b>智慧驱动</b></div><h2>登录工作台</h2>${field('账号','','text','placeholder="输入账号" required autocomplete="off"')}${field('密码','','password','placeholder="输入密码" required autocomplete="off"')}<button type="submit" class="btn full">登录</button></form></div>`;}
const renderers={'overview':overview,'content':contentHome,'topics':topics,'research':research,'comparison':comparison,'video':video,'editing':editing,'aigc':aigc,'assets':assets,'creation-settings':creationSettings,'publish':publish,'schedule':schedule,'tasks':tasks,'comments':comments,'private':()=>chatView('private'),'mini':()=>chatView('mini'),'handoffs':handoffs,'wx-chat':()=>chatView('wx'),'wx-broadcast':wxBroadcast,'wx-contacts':wxContacts,'wx-moments':wxMoments,'wx-persona':wxPersona,'wx-knowledge':wxKnowledge,'wx-accounts':wxAccounts,'wx-global':wxGlobal,'wx-system':wxSystem,'wx-mcp':wxMcp,'wx-skills':wxSkills,'wx-storage':wxStorage,'wx-logs':wxLogs,'wx-overview':wxOverview,'documents':documents,'versions':versions,'aliases':aliases,'rules':rules,'reply-test':replyTest,'accounts':accounts,'browser':browser,'ai':ai,'notifications':notifications,'usage':usage,'issues':issues,'runtime':runtime,'login':login};
const groupDefaults={overview:'overview',content:'content',publishing:'publish',inbox:'comments',wechat:'wx-chat',knowledge:'documents',channels:'accounts',settings:'ai'};
function render(){const requested=location.hash.slice(1)||'overview';current=catalog.some(p=>p[0]===requested)?requested:'overview';const index=catalog.findIndex(p=>p[0]===current);const page=catalog[index];const group=groups.find(g=>g[0]===page[2]);document.title=`${page[1]} · 智慧驱动精简预览`;document.body.classList.toggle('capture',new URLSearchParams(location.search).has('capture'));let subs=[...new Map(catalog.filter(p=>p[2]===page[2]&&p[0]!=='login').map(p=>[p[3],p])).values()];if(page[2]==='content')subs=subs.map(p=>p[3]==='自动成片'?catalog.find(x=>x[0]==='topics'):p);document.querySelector('#app').innerHTML=`<div class="app"><aside class="side"><a href="#overview" class="brand"><span class="brand-logo">${icon('brand')}</span>智慧驱动</a><nav class="side-nav" aria-label="主要导航">${groups.map((g,i)=>`${i===6?'<div class="side-caption">管理</div>':''}<a class="side-link ${page[2]===g[0]?'active':''}" href="#${groupDefaults[g[0]]}">${icon(g[2])}<span>${g[1]}</span></a>`).join('')}</nav><div class="side-bottom"><a href="./index.html">查看页面图册 ↗</a></div></aside><main class="work"><header class="topbar">${page[1]!==group[1]?`<span class="breadcrumb">${group[1]}</span>`:''}<h1>${page[1]}</h1></header>${subs.length>1?`<nav class="subnav" aria-label="${group[1]}栏目">${subs.map(p=>`<a class="${page[3]===p[3]?'active':''}" href="#${p[0]}">${p[3]}</a>`).join('')}</nav>`:''}<div class="content">${page[2]==='content'&&page[3]==='自动成片'?`<nav class="settings-nav" aria-label="自动成片流程">${['topics','research','comparison','video'].map(id=>`<a class="${current===id?'active':''}" href="#${id}">${catalog.find(p=>p[0]===id)[1]}</a>`).join('')}</nav>`:''}${renderers[current]()}<div class="preview-note">界面方案 · 示例内容</div></div></main></div><footer class="preview-bar" aria-label="预览翻页"><div class="row"><b>独立预览</b><span class="description">示例数据 · 未连接实际平台</span></div><div class="row"><span class="group-name">${group[1]}</span><button id="prev" ${index===0?'disabled':''}>← 上一页</button><span class="counter">${index+1} / ${catalog.length}</span><button id="next" ${index===catalog.length-1?'disabled':''}>下一页 →</button><a class="open-gallery" href="./index.html#${current}">图片翻页</a></div></footer>`;document.querySelector('#prev').onclick=()=>navigate(index-1);document.querySelector('#next').onclick=()=>navigate(index+1);bindLocal();window.scrollTo(0,0);}
function navigate(index){if(index>=0&&index<catalog.length)location.hash=catalog[index][0];}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3200);}
function modal(title,body,confirm='确定'){document.querySelector('.modal-overlay')?.remove();const wrapper=document.createElement('div');wrapper.className='modal-overlay';wrapper.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><h2>${title}</h2><button class="close" aria-label="关闭">×</button></header>${body}<div class="row end spaced">${btn('取消','data-close','secondary')}${btn(confirm,'data-confirm','')}</div></section>`;document.body.append(wrapper);wrapper.querySelectorAll('[data-close],.close').forEach(b=>b.onclick=()=>wrapper.remove());wrapper.querySelector('[data-confirm]').onclick=()=>{wrapper.remove();toast('仅演示页面操作，实际平台未更改。');};wrapper.onclick=e=>{if(e.target===wrapper)wrapper.remove();};wrapper.querySelector('.close').focus();}
function bindLocal(){document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');toast('已切换预览状态');});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const label=b.dataset.action;if(/保存|已在预览|已加入/.test(label))return toast(label);if(/编辑|添加|新建|配置|连接设置/.test(label))return modal(label,`${field('名称','','text','placeholder="输入名称"')}${field('内容（选填）','','textarea')}`,'保存预览');if(/群发确认/.test(label))return modal('发送群发', '<p>预览：向所选 3 位联系人发送此消息。</p><div class="notice">此操作仅演示确认流程，不会向微信发送消息。</div>','确认');if(/回退|退出|取消排期|切换.*人设|发布知识确认/.test(label))return modal(label,'<p>确认此项操作？</p><p>仅演示页面流程，实际平台不受影响。</p>');modal(label,`<p>${esc(label)}的页面演示。</p><div class="notice green">当前为独立预览，不调用真实服务。</div>`);});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');const old=document.querySelector('[data-filter-note]');old?.remove();const rows=document.querySelectorAll('tbody tr');if(rows.length){rows.forEach(r=>{r.hidden=b.dataset.filter!=='全部'&&!r.textContent.includes(b.dataset.filter.replace('待回复','待处理'));});if(![...rows].some(r=>!r.hidden)){const hint=document.createElement('p');hint.className='hint';hint.dataset.filterNote='';hint.textContent='此筛选下暂无示例记录';b.parentElement.after(hint);}}else toast(`已切换：${b.dataset.filter}`);});document.querySelectorAll('[data-search]').forEach(input=>input.oninput=()=>{const term=input.value.toLowerCase();const targets=document.querySelectorAll('[data-search-row]');(targets.length?targets:document.querySelectorAll('tbody tr')).forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(term));});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelector('#topicTitle').textContent=b.dataset.topic;document.querySelectorAll('.topic-card').forEach(c=>c.classList.remove('selected'));b.closest('.topic-card').classList.add('selected');});document.querySelectorAll('[data-upload]').forEach(input=>input.onchange=()=>{if(input.files[0]){input.closest('.upload').querySelector('strong').textContent=input.files[0].name;toast('文件仅用于本地预览，未上传');}});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>modal('任务详情',`<h3>${esc(b.dataset.task)}</h3><p>抖音 · 11 月 9 日 09:30</p><div class="settings-row"><strong>素材检查</strong>${badge('已通过')}</div><div class="settings-row"><strong>内容审核</strong>${badge('已通过')}</div><div class="settings-row"><strong>平台发布</strong>${badge('已发布')}</div>`));document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>modal(`回复 ${esc(b.dataset.reply)}`,field('回复内容','','textarea','placeholder="输入回复内容"'),'发送预览'));document.querySelectorAll('[data-conversation]').forEach(el=>{const selectConversation=()=>{document.querySelectorAll('.conversation').forEach(c=>c.classList.remove('active'));el.classList.add('active');const [n,text,reply]=messageRows[Number(el.dataset.conversation)];document.querySelector('#chatUser').textContent=n;document.querySelector('#chatMessages').innerHTML=`<div class="chat-date">今天</div><div class="bubble-row"><span class="avatar">${n[0]}</span><div class="bubble">${text}</div></div>${reply?`<div class="bubble-row mine"><div class="bubble">${reply}</div></div>`:''}`;};el.onclick=selectConversation;el.onkeydown=e=>{if(e.key==='Enter')selectConversation();};});const convSearch=document.querySelector('[data-conversation-search]');if(convSearch)convSearch.oninput=()=>document.querySelectorAll('.conversation').forEach(c=>c.hidden=!c.textContent.includes(convSearch.value));document.querySelector('[data-new-chat]')?.addEventListener('click',()=>document.querySelector('#chatMessages').innerHTML='<div class="chat-date">新建测试</div>');document.querySelectorAll('[data-open-schedule]').forEach(b=>b.onclick=()=>modal('定时发布',field('执行时间','2026-11-10T09:30','datetime-local'),'创建预览排期'));document.querySelectorAll('form').forEach(form=>form.onsubmit=e=>{e.preventDefault();if(form.dataset.form==='publish'){if(document.querySelector('#origin').selectedIndex===0)return toast('请选择内容来源');return modal('发布确认','<p>预览：向所选平台发布此内容。</p><div class="notice">此处不执行真实发布。</div>','确认预览');}if(form.dataset.form==='login'){toast('登录页面演示，无需真实账号密码');location.hash='overview';return;}const input=form.querySelector('textarea');if(input){const text=input.value.trim();if(!text)return toast('请输入内容');const box=document.querySelector('#chatMessages');box.insertAdjacentHTML('beforeend',`<div class="bubble-row mine"><div class="bubble">${esc(text)}</div></div>`);if(form.dataset.form==='test')box.insertAdjacentHTML('beforeend','<div class="bubble-row"><span class="avatar">智</span><div class="bubble">这是回复排版示意。实际答案将以知识库检索结果为准。</div></div>');input.value='';toast('仅显示在预览中，未向任何账号发送');}});}
window.addEventListener('hashchange',render);document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.modal-overlay')?.remove();if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.querySelector('.modal-overlay'))return;const i=catalog.findIndex(p=>p[0]===current);if(e.key==='ArrowRight'){e.preventDefault();navigate(i+1);}if(e.key==='ArrowLeft'){e.preventDefault();navigate(i-1);}});render();
</script></body></html>
