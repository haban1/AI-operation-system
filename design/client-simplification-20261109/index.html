lector('#shot').alt=p.title+'精简预览';document.querySelector('#title').textContent=p.title;document.querySelector('#group').textContent=p.groupName;document.querySelector('#count').textContent=(position+1)+' / '+pages.length;document.querySelector('#page').value=p.id;document.querySelector('#prev').disabled=position===0;document.querySelector('#next').disabled=position===pages.length-1;document.querySelector('#interactive').href='./interactive.html#'+p.id;document.querySelector('#saveImage').href=p.image;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.group===p.group));document.title=p.title+' · 全系统精简预览';document.querySelector('.no-image').style.display='none';document.querySelector('#shot').style.display='block';window.scrollTo(0,0);}function flip(delta){const p=pages[position+delta];if(p)location.hash=p.id;}document.querySelector('#prev').onclick=()=>flip(-1);document.querySelector('#next').onclick=()=>flip(1);document.querySelector('#page').onchange=e=>location.hash=e.target.value;document.querySelector('#zoom').onclick=()=>{document.body.classList.toggle('zoom');document.querySelector('#zoom').textContent=document.body.classList.contains('zoom')?'适应宽度':'原图大小';};document.querySelector('#shot').onerror=()=>{document.querySelector('#shot').style.display='none';document.querySelector('.no-image').style.display='block';};window.addEventListener('hashchange',show);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){e.preventDefault();flip(1);}if(e.key==='ArrowLeft'){e.preventDefault();flip(-1);}});show();</script></body></html>
