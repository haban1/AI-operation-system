[project]
name = "enterprise-faq-customer-service"
version = "0.3.0"
description = "Enterprise customer service backed by a curated FAQ knowledge base."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]
legacy-rag = [
    "langgraph>=1.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pymilvus>=2.4.0",
    "openai>=1.40.0",
    "pypdf>=4.3.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
