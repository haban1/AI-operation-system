name: Docs as Code

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify documentation checker
        run: node --test test/docs-as-code.test.mjs
      - name: Check each introduced commit
        shell: bash
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$DOCS_BASE" ] || [ -z "${DOCS_BASE//0/}" ]; then
            printf '%s %s %s %s\n' refs/heads/ci "$DOCS_HEAD" refs/heads/ci 0000000000000000000000000000000000000000 | node scripts/check-docs-as-code.mjs --pre-push
          else
            node scripts/check-docs-as-code.mjs --range "$DOCS_BASE..$DOCS_HEAD"
          fi
